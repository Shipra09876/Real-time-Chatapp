services:
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatapp-backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:7
    container_name: chatapp-redis
    ports:
      - "6379:6379"
